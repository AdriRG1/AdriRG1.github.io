<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Impacto y puntos — apellido_nombre_p5_16</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>

<body>
<script>

// ==========================
// VARIABLES ASTROS + CALENDARIO
// ==========================
let xS, xL;
let dia = 1;
let mes = 1;
let anio = 2026;

// ==========================
// STICKMAN (base T14)
// ==========================
let xP, yP;
let S;
let groundY;
let vP = 4;
let vY = 0;
let jumpV;
let g;

// ==========================
// DISPARO (T15)
// ==========================
let xD, yD;
let tD;
let vD;
let disparoActivo = false;

// ==========================
// OBJETIVO (T15)
// ==========================
let xO, yO;
let wO, hO;
let vO;

// ==========================
// PUNTOS (T16)
// ==========================
let puntos = 0;

// ==========================
// SETUP
// ==========================
function setup() {
  createCanvas(800, 450);

  // Astros
  xS = 0;
  xL = -400;

  // Suelo
  groundY = height * 0.8;

  // Stickman
  S = 0.12 * min(width, height);
  xP = width * 0.25;
  yP = groundY;
  jumpV = -0.03 * height;
  g = 0.0016 * height;

  // Disparo
  tD = 0.02 * min(width, height);
  vD = 0.04 * height;

  // Objetivo
  wO = 0.1 * width;
  hO = 0.05 * height;
  yO = random(0.2 * height, 0.35 * height);
  reiniciarObjetivo();
}

// ==========================
// DRAW
// ==========================
function draw() {

  // 1️⃣ Cielo día / noche
  if (xS < width) {
    background(135, 206, 235);
  } else {
    background(20, 30, 60);
  }

  // 2️⃣ Suelo
  fill(60, 180, 80);
  rect(0, groundY, width, height - groundY);

  // 3️⃣ Sol y luna
  dibujarSol();
  dibujarLuna();

  // 4️⃣ Movimiento astros + calendario
  xS += 1;
  xL += 1;

  if (xS > width * 2) {
    xS = 0;
    xL = -400;
    actualizarCalendario();
  }

  // 5️⃣ Objetivo (movimiento + dibujo)
  xO += vO;

  if (xO > width + wO || xO < -wO) {
    reiniciarObjetivo();
  }

  dibujarObjetivo();

  // 6️⃣ Disparo (movimiento)
  if (disparoActivo) {
    yD -= vD;

    if (yD < 0) {
      disparoActivo = false;
    }
  }

  // 7️⃣ Impacto
  if (disparoActivo) {
    if (
      xD > xO && xD < xO + wO &&
      yD > yO && yD < yO + hO
    ) {
      puntos++;
      disparoActivo = false;
      reiniciarObjetivo();
    }
  }

  // 8️⃣ Dibujar disparo
  dibujarDisparo();

  // 9️⃣ Stickman (lógica)
  if (keyIsDown(LEFT_ARROW)) xP -= vP;
  if (keyIsDown(RIGHT_ARROW)) xP += vP;
  xP = constrain(xP, 0, width);

  vY += g;
  yP += vY;
  if (yP > groundY) {
    yP = groundY;
    vY = 0;
  }

  // 🔟 Dibujar stickman
  dibujarStickman();

  // 1️⃣1️⃣ HUD
  dibujarCalendario();
  dibujarPuntos();
}

// ==========================
// INPUT
// ==========================
function keyPressed() {

  // Salto
  if (keyCode === UP_ARROW && yP === groundY) {
    vY = jumpV;
  }

  // Disparo
  if (key === ' ' && !disparoActivo) {
    disparoActivo = true;
    xD = xP;
    yD = yP - 0.8 * S;
  }
}

// ==========================
// FUNCIONES LÓGICA
// ==========================
function reiniciarObjetivo() {
  if (random(1) < 0.5) {
    xO = -wO;
    vO = random(2, 4);
  } else {
    xO = width + wO;
    vO = -random(2, 4);
  }
}

function actualizarCalendario() {
  dia++;
  if (dia > 30) {
    dia = 1;
    mes++;
    if (mes > 12) {
      mes = 1;
      anio++;
    }
  }
}

// ==========================
// FUNCIONES DE DIBUJO
// ==========================
function dibujarSol() {
  fill(255, 200, 0);
  noStroke();
  circle(xS, 80, 60);
}

function dibujarLuna() {
  fill(230);
  noStroke();
  circle(xL, 80, 50);
}

function dibujarObjetivo() {
  fill(200, 50, 50);
  rect(xO, yO, wO, hO, 10);
}

function dibujarDisparo() {
  if (disparoActivo) {
    fill(0);
    circle(xD, yD, tD);
  }
}

function dibujarStickman() {
  stroke(0);
  strokeWeight(2);

  let head = 0.2 * S;
  let body = 0.6 * S;
  let leg = 0.55 * S;

  let hipY = yP - leg;
  let shoulderY = hipY - body;
  let headY = shoulderY - head;

  circle(xP, headY, head * 2);
  line(xP, shoulderY, xP, hipY);
  line(xP, hipY, xP - 0.2*S, yP);
  line(xP, hipY, xP + 0.2*S, yP);
  line(xP, shoulderY, xP - 0.25*S, shoulderY + 0.3*S);
  line(xP, shoulderY, xP + 0.25*S, shoulderY + 0.3*S);

  noStroke();
}

function dibujarCalendario() {
  fill(255);
  textSize(14);
  text(dia + "/" + mes + "/" + anio, 10, 20);
}

function dibujarPuntos() {
  fill(255);
  textSize(16);
  text("Puntos: " + puntos, 10, 40);
}

</script>
</body>
</html>
