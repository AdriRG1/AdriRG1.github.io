<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>T15 Disparo y objetivo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>

<body>
<script>

// ==========================
// VARIABLES T12
// ==========================
let xS, yS, rS, vS;
let xL, yL, rL, vL;

let dia = 1;
let mes = 1;
let anio = 2026;

// ==========================
// VARIABLES T13 (stickman)
// ==========================
let xP, yP;
let S;
let vP;

let groundY;
let vY;
let jumpV;
let g;

// ==========================
// T15 — DISPARO
// ==========================
let xD, yD;
let tD;
let vD;
let disparoActivo;

// ==========================
// T15 — OBJETIVO
// ==========================
let xO, yO;
let wO, hO;
let vO;

function setup() {
  createCanvas(800, 500);

  // Sol
  xS = -40;
  yS = 0.25 * height;
  rS = 40;
  vS = width / 600;

  // Luna
  xL = -width;
  yL = 0.25 * height;
  rL = 30;
  vL = vS;

  // Suelo
  groundY = 0.80 * height;

  // Stickman
  S  = 0.12 * min(width, height);
  xP = 0.25 * width;
  yP = groundY;

  vP = width / 150;

  vY = 0;
  jumpV = -0.030 * height;
  g = 0.0016 * height;

  // Disparo
  tD = 0.02 * min(width, height);
  vD = 0.04 * height;
  disparoActivo = false;

  // Objetivo
  wO = 0.10 * width;
  hO = 0.05 * height;
  yO = random(0.20 * height, 0.35 * height);

  xO = -wO;
  vO = random(1.5, 3);
}

function draw() {

  // 1️⃣ Día / noche
  if (xS < width) {
    background(135, 206, 235);
  } else {
    background(20, 30, 60);
  }

  // 2️⃣ Suelo
  fill(60, 180, 80);
  rect(0, groundY, width, height - groundY);

  // 3️⃣ Sol y Luna
  dibujarSol();
  dibujarLuna();

  // 4️⃣ Movimiento sol/luna + calendario
  xS += vS;
  xL += vL;

  if (xS > 2 * width + rS) {
    xS = -rS;
    xL = -width - rL;
    actualizarCalendario();
  }

  // 5️⃣ Objetivo
  xO += vO;

  if (xO > width + wO) {
    xO = -wO;
    vO = random(1.5, 3);
  } else if (xO < -wO) {
    xO = width + wO;
    vO = -random(1.5, 3);
  }

  dibujarObjetivo();

  // 6️⃣ Disparo
  if (disparoActivo) {
    yD -= vD;

    if (yD < 0) {
      disparoActivo = false;
    }

    dibujarDisparo();
  }

  // 7️⃣ Stickman (lógica + dibujo)
  if (keyIsDown(LEFT_ARROW)) {
    xP -= vP;
  } else if (keyIsDown(RIGHT_ARROW)) {
    xP += vP;
  }

  xP = constrain(xP, 0, width);

  vY += g;
  yP += vY;

  if (yP > groundY) {
    yP = groundY;
    vY = 0;
  }

  dibujarStickman();

  // 8️⃣ Calendario
  dibujarCalendario();
}

function keyPressed() {

  // Salto
  if (keyCode === UP_ARROW && yP === groundY) {
    vY = jumpV;
  }

  // Disparo (barra espaciadora)
  if (key === ' ' && !disparoActivo) {
    xD = xP;
    yD = yP - 0.8 * S;
    disparoActivo = true;
  }
}

// ==========================
// FUNCIONES DE DIBUJO
// ==========================
function dibujarSol() {
  fill(255, 204, 0);
  noStroke();
  circle(xS, yS, rS * 2);
}

function dibujarLuna() {
  fill(230);
  noStroke();
  circle(xL, yL, rL * 2);
}

function dibujarObjetivo() {
  fill(200, 50, 50);
  noStroke();
  rect(xO, yO, wO, hO, 10);
}

function dibujarDisparo() {
  fill(255, 50, 50);
  noStroke();
  circle(xD, yD, tD);
}

function dibujarStickman() {

  let rHead = 0.20 * S;
  let bodyL = 0.60 * S;
  let armL  = 0.45 * S;
  let legL  = 0.55 * S;

  let hipY = yP - legL;
  let shoulderY = hipY - bodyL;
  let headY = shoulderY - rHead;

  stroke(0);
  strokeWeight(0.06 * S);
  noFill();

  circle(xP, headY, 2 * rHead);
  line(xP, shoulderY, xP, hipY);

  line(xP - 0.25*S, shoulderY, xP + 0.25*S, shoulderY);
  line(xP - 0.25*S, shoulderY, xP - 0.25*S, shoulderY + armL);
  line(xP + 0.25*S, shoulderY, xP + 0.25*S, shoulderY + armL);

  line(xP, hipY, xP - 0.18*S, yP);
  line(xP, hipY, xP + 0.18*S, yP);
}

function dibujarCalendario() {
  fill(255);
  textSize(16);
  textAlign(LEFT, TOP);
  text("Fecha: " + dia + "/" + mes + "/" + anio, 20, 20);
}

function actualizarCalendario() {
  dia++;
  if (dia > 30) {
    dia = 1;
    mes++;
    if (mes > 12) {
      mes = 1;
      anio++;
    }
  }
}

</script>
</body>
</html>
