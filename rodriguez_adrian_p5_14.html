<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>T14 Funciones mínimas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>

<body>
<script>

// ==========================
// VARIABLES T12
// ==========================
let xS, yS, rS, vS;
let xL, yL, rL, vL;

let dia = 1;
let mes = 1;
let anio = 2026;

// ==========================
// VARIABLES T13 (stickman)
// ==========================
let xP, yP;
let S;
let vP;

let groundY;
let vY;
let jumpV;
let g;

function setup() {
  createCanvas(800, 500);

  // Sol
  xS = -40;
  yS = 0.25 * height;
  rS = 40;
  vS = width / 600;

  // Luna
  xL = -width;
  yL = 0.25 * height;
  rL = 30;
  vL = vS;

  // Suelo
  groundY = 0.80 * height;

  // Stickman
  S  = 0.12 * min(width, height);
  xP = 0.25 * width;
  yP = groundY;

  vP = width / 150;

  vY = 0;
  jumpV = -0.030 * height;
  g = 0.0016 * height;
}

function draw() {

  // ==========================
  // Día / noche
  // ==========================
  if (xS < width) {
    background(135, 206, 235);
  } else {
    background(20, 30, 60);
  }

  // ==========================
  // Sol
  // ==========================
  fill(255, 204, 0);
  noStroke();
  circle(xS, yS, rS * 2);
  xS += vS;

  // ==========================
  // Luna
  // ==========================
  fill(230);
  circle(xL, yL, rL * 2);
  xL += vL;

  if (xS > 2 * width + rS) {
    xS = -rS;
    xL = -width - rL;
    actualizarCalendario();
  }

  // ==========================
  // Suelo
  // ==========================
  fill(60, 180, 80);
  rect(0, groundY, width, height - groundY);

  // ==========================
  // Movimiento horizontal
  // ==========================
  if (keyIsDown(LEFT_ARROW)) {
    xP -= vP;
  } else if (keyIsDown(RIGHT_ARROW)) {
    xP += vP;
  }

  xP = constrain(xP, 0, width);

  // ==========================
  // Salto (física)
  // ==========================
  vY += g;
  yP += vY;

  if (yP > groundY) {
    yP = groundY;
    vY = 0;
  }

  // ==========================
  // Stickman (FUNCIÓN)
  // ==========================
  dibujarStickman();

  // ==========================
  // Calendario (texto)
  // ==========================
  fill(255);
  textSize(16);
  textAlign(LEFT, TOP);
  text("Fecha: " + dia + "/" + mes + "/" + anio, 20, 20);
}

function keyPressed() {
  if (keyCode === UP_ARROW) {
    if (yP === groundY) {
      vY = jumpV;
    }
  }
}

// ==========================
// FUNCIONES T14
// ==========================
function dibujarStickman() {

  let rHead = 0.20 * S;
  let bodyL = 0.60 * S;
  let armL  = 0.45 * S;
  let legL  = 0.55 * S;

  let hipY = yP - legL;
  let shoulderY = hipY - bodyL;
  let headY = shoulderY - rHead;

  stroke(0);
  strokeWeight(0.06 * S);
  noFill();

  // Cabeza
  circle(xP, headY, 2 * rHead);

  // Tronco
  line(xP, shoulderY, xP, hipY);

  // Brazos
  line(xP - 0.25*S, shoulderY, xP + 0.25*S, shoulderY);
  line(xP - 0.25*S, shoulderY, xP - 0.25*S, shoulderY + armL);
  line(xP + 0.25*S, shoulderY, xP + 0.25*S, shoulderY + armL);

  // Piernas
  line(xP, hipY, xP - 0.18*S, yP);
  line(xP, hipY, xP + 0.18*S, yP);
}

function actualizarCalendario() {
  dia++;
  if (dia > 30) {
    dia = 1;
    mes++;
    if (mes > 12) {
      mes = 1;
      anio++;
    }
  }
}

</script>
</body>
</html>
