<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Obstáculo y Game Over — apellido_nombre_p5_17</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>

<body>
<script>

// ==========================
// VARIABLES ASTROS + CALENDARIO
// ==========================
let xS, xL;
let dia = 1;
let mes = 1;
let anio = 2026;

// ==========================
// STICKMAN
// ==========================
let xP, yP;
let S;
let groundY;
let vP = 4;
let vY = 0;
let jumpV;
let g;

// Hitbox stickman
let wP = 30;
let hP = 70;

// ==========================
// DISPARO
// ==========================
let xD, yD;
let tD;
let vD;
let disparoActivo = false;

// ==========================
// OBJETIVO
// ==========================
let xO, yO;
let wO, hO;
let vO;

// ==========================
// OBSTÁCULO (T17)
// ==========================
let xB, yB;
let wB, hB;
let vB;

// ==========================
// JUEGO
// ==========================
let puntos = 0;
let gameOver = false;

// ==========================
// SETUP
// ==========================
function setup() {
  createCanvas(800, 450);

  xS = 0;
  xL = -400;

  groundY = height * 0.8;

  S = 0.12 * min(width, height);
  xP = width * 0.25;
  yP = groundY;
  jumpV = -0.03 * height;
  g = 0.0016 * height;

  tD = 0.02 * min(width, height);
  vD = 0.04 * height;

  wO = 0.1 * width;
  hO = 0.05 * height;
  yO = random(0.2 * height, 0.35 * height);
  reiniciarObjetivo();

  // Obstáculo
  wB = 40;
  hB = 30;
  yB = groundY - hB;
  reiniciarObstaculo();
}

// ==========================
// DRAW
// ==========================
function draw() {

  // Fondo
  if (xS < width) background(135, 206, 235);
  else background(20, 30, 60);

  // Suelo
  fill(60, 180, 80);
  rect(0, groundY, width, height - groundY);

  // Dibujos fijos
  dibujarSol();
  dibujarLuna();

  // ==========================
  // ACTUALIZACIONES (solo si NO hay game over)
  // ==========================
  if (gameOver == false) {

    // Astros + calendario
    xS += 1;
    xL += 1;
    if (xS > width * 2) {
      xS = 0;
      xL = -400;
      actualizarCalendario();
    }

    // Objetivo
    xO += vO;
    if (xO > width + wO || xO < -wO) {
      reiniciarObjetivo();
    }

    // Disparo
    if (disparoActivo) {
      yD -= vD;
      if (yD < 0) disparoActivo = false;

      // Impacto
      if (
        xD > xO && xD < xO + wO &&
        yD > yO && yD < yO + hO
      ) {
        puntos++;
        disparoActivo = false;
        reiniciarObjetivo();
      }
    }

    // Obstáculo
    xB += vB;
    if (xB > width + wB || xB < -wB) {
      reiniciarObstaculo();
    }

    // Movimiento stickman
    if (keyIsDown(LEFT_ARROW)) xP -= vP;
    if (keyIsDown(RIGHT_ARROW)) xP += vP;
    xP = constrain(xP, 0, width);

    vY += g;
    yP += vY;
    if (yP > groundY) {
      yP = groundY;
      vY = 0;
    }

    // Colisión stickman–obstáculo
    if (colisionStickmanObstaculo()) {
      gameOver = true;
    }
  }

  // ==========================
  // DIBUJO (siempre)
  // ==========================
  dibujarObjetivo();
  dibujarDisparo();
  dibujarObstaculo();
  dibujarStickman();
  dibujarCalendario();
  dibujarPuntos();

  if (gameOver == true) {
    dibujarGameOver();
  }
}

// ==========================
// INPUT
// ==========================
function keyPressed() {
  if (gameOver) return;

  if (keyCode === UP_ARROW && yP === groundY) {
    vY = jumpV;
  }

  if (key === ' ' && !disparoActivo) {
    disparoActivo = true;
    xD = xP;
    yD = yP - 0.8 * S;
  }
}

// ==========================
// LÓGICA
// ==========================
function reiniciarObjetivo() {
  if (random(1) < 0.5) {
    xO = -wO;
    vO = random(2, 4);
  } else {
    xO = width + wO;
    vO = -random(2, 4);
  }
}

function reiniciarObstaculo() {
  if (random(1) < 0.5) {
    xB = -wB;
    vB = random(2, 4);
  } else {
    xB = width + wB;
    vB = -random(2, 4);
  }
}

function actualizarCalendario() {
  dia++;
  if (dia > 30) {
    dia = 1;
    mes++;
    if (mes > 12) {
      mes = 1;
      anio++;
    }
  }
}

function colisionStickmanObstaculo() {
  let izP = xP - wP / 2;
  let deP = xP + wP / 2;
  let arP = yP - hP;
  let abP = yP;

  let izB = xB;
  let deB = xB + wB;
  let arB = yB;
  let abB = yB + hB;

  let solapaX = deP > izB && izP < deB;
  let solapaY = abP > arB && arP < abB;

  return solapaX && solapaY;
}

// ==========================
// DIBUJO
// ==========================
function dibujarSol() {
  fill(255, 200, 0);
  noStroke();
  circle(xS, 80, 60);
}

function dibujarLuna() {
  fill(230);
  circle(xL, 80, 50);
}

function dibujarObjetivo() {
  fill(200, 50, 50);
  rect(xO, yO, wO, hO, 10);
}

function dibujarObstaculo() {
  fill(100);
  rect(xB, yB, wB, hB);
}

function dibujarDisparo() {
  if (disparoActivo) {
    fill(0);
    circle(xD, yD, tD);
  }
}

function dibujarStickman() {
  stroke(0);
  let head = 0.2 * S;
  let body = 0.6 * S;
  let leg = 0.55 * S;

  let hipY = yP - leg;
  let shoulderY = hipY - body;
  let headY = shoulderY - head;

  circle(xP, headY, head * 2);
  line(xP, shoulderY, xP, hipY);
  line(xP, hipY, xP - 0.2*S, yP);
  line(xP, hipY, xP + 0.2*S, yP);
  line(xP, shoulderY, xP - 0.25*S, shoulderY + 0.3*S);
  line(xP, shoulderY, xP + 0.25*S, shoulderY + 0.3*S);
  noStroke();
}

function dibujarCalendario() {
  fill(255);
  textSize(14);
  text(dia + "/" + mes + "/" + anio, 10, 20);
}

function dibujarPuntos() {
  fill(255);
  textSize(16);
  text("Puntos: " + puntos, 10, 40);
}

function dibujarGameOver() {
  fill(0, 180);
  rect(0, 0, width, height);

  fill(255);
  textAlign(CENTER, CENTER);
  textSize(40);
  text("GAME OVER", width / 2, height / 2 - 20);

  textSize(22);
  text("Puntos: " + puntos, width / 2, height / 2 + 25);
}

</script>
</body>
</html>
